server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gov_service_platform?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

ai:
  service:
    url: http://localhost:5000

jwt:
  secret: GovServicePlatformSecretKey2024VeryLongSecretKeyForJWT
  expiration: 86400000

logging:
  level:
    com.gov.serviceplatform: DEBUG
    org.hibernate.SQL: DEBUG
